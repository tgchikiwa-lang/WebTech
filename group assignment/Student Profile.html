<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Student Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky navigation rail plus one content column on desktop; the rail collapses into a scrolling tab strip on phones. Palette: cool slate with a teal accent and marigold used only for highlights. */
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --sunk:#E3E9ED; --ink:#12202A; --ink2:#4B5C68; --line:#D2DBE1;
  --accent:#0A6F8C; --accent-ink:#FFFFFF; --accent-soft:#D6EBF1;
  --mark:#E3A400; --mark-soft:#FBEFC9;
  --good:#1D7A4D; --good-soft:#D8EFE1; --warn:#9A5C00; --warn-soft:#F9E8C7; --bad:#B0303A; --bad-soft:#F7D9DB;
  --c1:#0A6F8C; --c2:#BE5328; --c3:#5A7D1C; --c4:#7A4EA4; --c5:#AE3A69;
  --font-d:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-b:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-m:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D151A; --surface:#141F27; --sunk:#1B2933; --ink:#E5EDF1; --ink2:#9EB0BB; --line:#25343F;
    --accent:#4FB8D6; --accent-ink:#06222B; --accent-soft:#15313C;
    --mark:#F0C04A; --mark-soft:#3A2F10;
    --good:#5FCB93; --good-soft:#12301F; --warn:#E8B04A; --warn-soft:#38290E; --bad:#F08189; --bad-soft:#3A1A1D;
    --c1:#4FB8D6; --c2:#F08A5D; --c3:#9DC653; --c4:#B993E0; --c5:#EE7FAE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D151A; --surface:#141F27; --sunk:#1B2933; --ink:#E5EDF1; --ink2:#9EB0BB; --line:#25343F;
  --accent:#4FB8D6; --accent-ink:#06222B; --accent-soft:#15313C;
  --mark:#F0C04A; --mark-soft:#3A2F10;
  --good:#5FCB93; --good-soft:#12301F; --warn:#E8B04A; --warn-soft:#38290E; --bad:#F08189; --bad-soft:#3A1A1D;
  --c1:#4FB8D6; --c2:#F08A5D; --c3:#9DC653; --c4:#B993E0; --c5:#EE7FAE;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--font-d);font-weight:650;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.small{font-size:13px}
.lbl{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:600}

/* shell */
.app{max-width:1340px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:20px 48px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start}
.rail{position:sticky;top:calc(20px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 14px;max-height:calc(100vh - 40px);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.brand b{font-family:var(--font-d);font-size:21px;letter-spacing:-.02em}
.brand svg{flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink2);font-weight:550}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .badge{margin-left:auto;background:var(--mark);color:#241A00;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px;font-family:var(--font-m)}
.rail-foot{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 4px;cursor:pointer;font-weight:600;color:var(--ink2);font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.demo-tag{font-size:12px;color:var(--ink2);line-height:1.4;padding:0 4px}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:600;font-size:inherit;text-decoration:underline;text-underline-offset:3px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--sunk);border:0;border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink)}
.main{min-width:0;display:flex;flex-direction:column;gap:22px}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.top h1{font-size:clamp(26px,3.4vw,38px);line-height:1.1}
.top .term{font-size:13px;color:var(--ink2);margin-top:6px}
.user{display:flex;align-items:center;gap:10px;font-size:13px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-d);font-weight:700;flex:none}
.user b{display:block;font-size:14px}

/* generic parts */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card h2{font-size:18px;margin-bottom:2px}
.card .sub{font-size:13px;color:var(--ink2);margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;align-items:start}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px}
.btn:hover:not(:disabled){border-color:var(--ink2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.gchip{display:inline-block;min-width:34px;text-align:center;border-radius:8px;padding:1px 8px;font-family:var(--font-m);font-weight:500;font-size:13px}
.g-a{background:var(--good-soft);color:var(--good)}
.g-b{background:var(--accent-soft);color:var(--accent)}
.g-c{background:var(--warn-soft);color:var(--warn)}
.g-f{background:var(--bad-soft);color:var(--bad)}
.bar{position:relative;height:8px;border-radius:99px;background:var(--sunk);overflow:visible}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent);min-width:2px}
.bar>i.pend{background:repeating-linear-gradient(135deg,var(--mark) 0 4px,var(--mark-soft) 4px 8px)}
.bar>i.good{background:var(--good)}.bar>i.warn{background:var(--warn)}.bar>i.bad{background:var(--bad)}
.bar>u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px;text-decoration:none}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);text-align:left;font-weight:600;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.empty{padding:22px;text-align:center;color:var(--ink2);border:1px dashed var(--line);border-radius:12px}
.note{font-size:13px;color:var(--ink2);background:var(--sunk);border-radius:10px;padding:10px 12px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.good{background:var(--good-soft);color:var(--good)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
.field textarea{min-height:96px;resize:vertical}
.formrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 13px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink2)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* dashboard */
.hello{display:flex;flex-direction:column;gap:6px}
.hello .next{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.hello .next .t{font-family:var(--font-m);font-size:13px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));border-block:1px solid var(--line)}
.strip>div{padding:16px 18px 16px 0;display:flex;flex-direction:column;gap:2px}
.strip>div+div{padding-left:18px;border-left:1px solid var(--line)}
.strip .v{font-family:var(--font-d);font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.strip .v small{font-size:15px;font-weight:600;color:var(--ink2);margin-left:4px}
.strip .v.hl{box-shadow:inset 0 -10px 0 var(--mark-soft)}
.list{display:flex;flex-direction:column}
.list>div{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list>div:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.list .when{font-family:var(--font-m);font-size:12.5px;text-align:right;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--cc)}
.chk{width:18px;height:18px;accent-color:var(--accent);flex:none}
.done-t{text-decoration:line-through;color:var(--ink2)}
.att{display:grid;grid-template-columns:62px 1fr 48px;gap:10px;align-items:center;padding:7px 0}
.att .bar{height:7px}

/* courses */
.course{display:flex;flex-direction:column;gap:14px}
.course header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.course header .code{font-family:var(--font-m);font-size:12.5px;color:var(--cc);font-weight:500}
.course header h3{font-size:19px;line-height:1.2}
.big{font-family:var(--font-d);font-size:36px;font-weight:700;line-height:1;text-align:right;letter-spacing:-.02em}
.arow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.arow .nm small{color:var(--ink2);margin-left:4px}
.arow .val{font-family:var(--font-m);font-size:12.5px;text-align:right;white-space:nowrap}
.plan{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.plan .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:14px}
.plan select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.plan .answer{font-family:var(--font-d);font-size:20px;font-weight:650}
details.term{border-top:1px solid var(--line)}
details.term summary{cursor:pointer;padding:12px 0;display:flex;gap:12px;align-items:center;font-weight:600;list-style:none}
details.term summary::-webkit-details-marker{display:none}
details.term summary .gp{margin-left:auto;font-family:var(--font-m)}
.scale{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2)}

/* timetable */
.tt-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.tt{display:grid;grid-template-columns:54px repeat(5,minmax(112px,1fr));min-width:660px}
.tt .hd{padding:10px 8px;text-align:center;font-weight:650;font-size:13px;border-bottom:1px solid var(--line);background:var(--surface)}
.tt .hd.today{color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.tt .tcol{position:relative;border-left:1px solid var(--line);height:var(--h);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--rh)}
.tt .tcol.today{background-color:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.tt .hrs{position:relative;height:var(--h)}
.tt .hrs span{position:absolute;right:8px;transform:translateY(-50%);font-family:var(--font-m);font-size:11px;color:var(--ink2)}
.blk{position:absolute;left:4px;right:4px;border-radius:8px;border-left:4px solid var(--cc);background:color-mix(in srgb,var(--cc) 15%,var(--surface));padding:5px 7px;font-size:12px;line-height:1.3;overflow:hidden}
.blk b{display:block;font-family:var(--font-m);font-weight:500;font-size:11.5px;color:var(--cc)}
.blk span{color:var(--ink2)}

/* fees */
.stacked{height:14px;border-radius:99px;background:var(--sunk);display:flex;position:relative;overflow:visible}
.stacked i{display:block;height:100%}
.stacked i:first-child{border-radius:99px 0 0 99px;background:var(--accent)}
.stacked i.pend{background:repeating-linear-gradient(135deg,var(--mark) 0 4px,var(--mark-soft) 4px 8px)}
.stacked u{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);text-decoration:none}
.bal{font-family:var(--font-d);font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* registration */
.opt{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt .hd{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.opt .hd .nm{min-width:0}
.opt .hd .nm b{font-family:var(--font-d);font-size:16.5px}
.opt .meta{font-size:13px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 14px}
.opt.in{background:linear-gradient(90deg,var(--accent-soft),transparent 70%);margin-inline:-18px;padding-inline:18px}
.meter{position:relative;height:10px;border-radius:99px;background:var(--sunk);margin:8px 0 22px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent)}
.meter u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);text-decoration:none}
.meter u span{position:absolute;top:16px;left:50%;transform:translateX(-50%);font:11px var(--font-m);color:var(--ink2)}
.sticky{position:sticky;top:calc(20px + env(safe-area-inset-top,0px))}

/* announcements */
.ann{border-bottom:1px solid var(--line);padding:14px 0}
.ann:last-child{border-bottom:0}
.ann button.h{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:flex-start;width:100%;cursor:pointer;border-radius:8px}
.ann button.h:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.ann .tt2{flex:1;min-width:0}
.ann .tt2 b{font-family:var(--font-d);font-size:16.5px;display:block}
.ann .unr{width:9px;height:9px;border-radius:50%;background:var(--mark);flex:none;margin-top:8px}
.ann .body{margin:10px 0 0 21px;max-width:68ch}

/* gradebook */
.gb input{width:70px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-family:var(--font-m);font-size:13px;text-align:right}
.gb input[aria-invalid="true"]{border-color:var(--bad);background:var(--bad-soft)}
.gb tr.risk td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.dist{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:6px}
.dist div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}
.dist i{display:block;width:100%;border-radius:6px 6px 0 0;background:var(--accent);min-height:2px}
.dist span{font:12px var(--font-m);color:var(--ink2)}
.csvbox{width:100%;min-height:110px;font-family:var(--font-m);font-size:12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:10px}

/* messages */
.chat{display:grid;grid-template-columns:minmax(250px,320px) minmax(0,1fr);border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;min-height:520px}
.tlist{border-right:1px solid var(--line);display:flex;flex-direction:column;max-height:640px;overflow-y:auto}
.tlist .grp{padding:12px 16px 6px}
.th{all:unset;box-sizing:border-box;display:flex;gap:11px;align-items:flex-start;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--line);width:100%}
.th:hover{background:var(--sunk)}
.th:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.th[aria-current="true"]{background:var(--accent-soft)}
.th .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;font:700 13px var(--font-d);background:color-mix(in srgb,var(--cc) 20%,var(--surface));color:var(--cc)}
.th .tx{flex:1;min-width:0}
.th .tx b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .tx .sb{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .tx .pv{font-size:13px;color:var(--ink2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.th .mt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none;font:11.5px var(--font-m);color:var(--ink2)}
.th .ub{background:var(--mark);color:#241A00;border-radius:99px;font:700 11px var(--font-m);padding:1px 7px}
.conv{display:flex;flex-direction:column;min-width:0}
.conv .ch{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.conv .ch h2{font-size:17px}
.msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:6px;max-height:440px;min-height:260px}
.day{align-self:center;font-size:11.5px;color:var(--ink2);background:var(--sunk);border-radius:99px;padding:2px 12px;margin:8px 0}
.bub{max-width:min(78%,520px);padding:9px 13px;border-radius:16px;background:var(--sunk);align-self:flex-start;border-bottom-left-radius:5px;overflow-wrap:anywhere;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-left-radius:16px;border-bottom-right-radius:5px}
.bub time{display:block;font:11px var(--font-m);opacity:.7;margin-top:3px}
.composer{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.composer .row{display:flex;gap:10px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;resize:none;min-height:46px;max-height:140px}
.composer .chips button{font-size:12.5px;padding:3px 11px}
.only-m{display:none}
.nomsg{margin:auto;text-align:center;color:var(--ink2);padding:24px}

/* chart */
.ax text{fill:var(--ink2);font:11px var(--font-m)}

function calc(c,row){
  let earned=0,done=0,cwE=0,cwD=0,cwT=0;
  c.as.forEach((a,j)=>{

  });
  return {earned,done,standing:done?earned/done*100:null,cwE,cwD,cwT};
}

function prereqState(c){
  let st='ok';const notes=[];
  c.pre.forEach(code=>{
    const h=HIST.flatMap(t=>t.rows).find(r=>r[0]===code);
    if(h&&h[3]>=50){notes.push(code+' passed');return}
    const cur=CUR.find(x=>x.code===code);
    if(cur){const k=calc(cur,marks[code][0]);

      else{notes.push(code+' in progress, below 50%');st='blocked'}
    }else{notes.push(code+' not completed');st='blocked'}
  });
  return {st,notes};
}

}

  CUR.forEach((c,ci)=>c.as.forEach((a,j)=>{if(marks[c.code][0][j]==null&&a.due!=null)out.push({c,ci,a,j,due:a.due})}));
  return out.sort((x,y)=>x.due-y.due);
}
const isRead=a=>S.read[a.id]!==undefined?S.read[a.id]:!a.unread;
const allAnn=()=>S.posted.concat(ANN_BASE);
const unreadCount=()=>allAnn().filter(a=>!isRead(a)).length;

function renderGrid(blocks,showToday){
  const START=8,END=17,RH=56,H=(END-START)*RH;
  const wd=(new Date().getDay()+6)%7+1;
  let h='<div class="tt-scroll"><div class="tt" style="--rh:'+RH+'px;--h:'+H+'px">';
  h+='<div class="hd"></div>'+DAYS.map((d,i)=>'<div class="hd'+(showToday&&wd===i+1?' today':'')+'">'+d+'</div>').join('');
  h+='<div class="hrs">';
  for(let t=START;t<=END;t++)h+='<span style="top:'+((t-START)*RH)+'px">'+hh(t)+'</span>';
  h+='</div>';
  for(let d=1;d<=5;d++){
    h+='<div class="tcol'+(showToday&&wd===d?' today':'')+'">';
    blocks.filter(b=>b.d===d).forEach(b=>{
      h+='<div class="blk" style="--cc:var(--c'+(b.ci%5+1)+');top:'+((b.s-START)*RH+1)+'px;height:'+((b.e-b.s)*RH-3)+'px"><b>'+esc(b.code)+'</b>'+esc(b.room)+(b.t?' <span>· '+esc(b.t)+'</span>':'')+'<br><span>'+hh(b.s)+'–'+hh(b.e)+'</span></div>';
    });
    h+='</div>';
  }
  return h+'</div></div>';
}
const blocksOf=(list)=>list.flatMap((c,i)=>c.slots.map(s=>Object.assign({},s,{code:c.code,ci:i})));

function trendSvg(pts){
  const W=360,H=176,pl=34,pr=18,pt=22,pb=30,min=2,max=4;
  const x=i=>pl+(pts.length>1?i*(W-pl-pr)/(pts.length-1):0);
  const y=v=>pt+(max-clamp(v,min,max))/(max-min)*(H-pt-pb);
  let s='<svg class="trend ax" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Semester GPA trend: '+pts.map(p=>p.short+' '+p.gpa.toFixed(2)).join(', ')+'">';
  [2,2.5,3,3.5,4].forEach(g=>{s+='<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(g)+'" y2="'+y(g)+'"/>';if(g%1===0)s+='<text x="'+(pl-8)+'" y="'+(y(g)+4)+'" text-anchor="end">'+g.toFixed(1)+'</text>'});
  const solid=pts.filter(p=>!p.proj);
  if(solid.length>1)s+='<polyline class="ln" points="'+solid.map((p,i)=>x(i)+','+y(p.gpa)).join(' ')+'"/>';
  const last=pts.length-1;
  if(pts[last].proj&&last>0)s+='<line class="ln dash" x1="'+x(last-1)+'" y1="'+y(pts[last-1].gpa)+'" x2="'+x(last)+'" y2="'+y(pts[last].gpa)+'"/>';
  pts.forEach((p,i)=>{
    s+='<circle class="pt'+(p.proj?' proj':'')+'" cx="'+x(i)+'" cy="'+y(p.gpa)+'" r="5.5"/>';
    s+='<text class="v" x="'+x(i)+'" y="'+(y(p.gpa)-12)+'">'+p.gpa.toFixed(2)+'</text>';
    s+='<text class="x" x="'+x(i)+'" y="'+(H-8)+'">'+esc(p.short)+(p.proj?' (proj.)':'')+'</text>';
  });
  return s+'</svg>';
}

function vCourses(){
  const cards=CUR.map((c,ci)=>{
    const row=marks[c.code][0],k=calc(c,row);
    const exam=c.as.find(a=>a.type==='exam'),ej=c.as.indexOf(exam),examDone=row[ej]!=null;
    const tgt=S.target[c.code]||'A',T=SCALE.find(x=>x[1]===tgt)[0];
    const att=Math.round(c.att[1]/c.att[0]*100);
    let ans='';
    if(examDone){ans='Final mark <span class="answer">'+k.earned.toFixed(1)+'%</span> '+chip(k.earned)}
    else{
      const rem=k.cwT-k.cwD,frac=k.cwD?k.cwE/k.cwD:0.6,proj=k.cwE+rem*frac,need=(T-proj)/exam.w*100;
      const best=proj+exam.w;
      if(need<=0)ans='<span class="answer">Already within reach</span> <span class="muted small">any exam mark keeps you at '+tgt+' or better</span>';
      else if(need>100)ans='<span class="answer">Out of reach</span> <span class="muted small">you would need '+Math.round(need)+'% in the exam. Best possible is '+chip(best).replace(/\s+/g,' ')+'</span>';
      else ans='Aim for <span class="answer">'+Math.ceil(need)+'%</span> <span class="muted small">in the exam ('+Math.ceil(need)+' out of 100)</span>';
    }
    return '<article class="card course" style="--cc:var(--c'+(ci%5+1)+')">'+
     '<header><div><span class="code">'+c.code+' · '+c.cr+' credits</span><h3>'+esc(c.name)+'</h3><div class="small muted">'+esc(c.lect)+'</div></div>'+
       '<div><div class="big">'+(k.standing!=null?Math.round(k.standing)+'%':'–')+'</div><div style="text-align:right;margin-top:6px">'+(k.standing!=null?chip(k.standing):'')+'</div></div></header>'+
     '<div class="stack" style="gap:10px">'+c.as.map((a,j)=>{
        const v=row[j],has=v!=null;
        return '<div class="arow"><span class="nm">'+esc(a.n)+'<small>'+a.w+'%</small></span><div class="bar" aria-hidden="true"><i style="width:'+(has?v/a.max*100:0)+'%;background:'+(has?'var(--cc)':'transparent')+'"></i></div><span class="val">'+(has?v+' / '+a.max:'due '+fmt(a.due))+'</span></div>';
     }).join('')+'</div>'+
     '<div class="plan"><div class="row"><span class="lbl">Exam planner</span><label for="tg-'+c.code+'" class="small muted">Target grade</label><select id="tg-'+c.code+'" data-act="target" data-code="'+c.code+'">'+['A','B+','B','C+','C'].map(g=>'<option'+(g===tgt?' selected':'')+'>'+g+'</option>').join('')+'</select></div>'+
       '<div class="row">'+ans+'</div>'+(examDone?'':'<div class="small muted">Assumes the coursework still to be marked comes in at your current average.</div>')+'</div>'+
     '<div class="att" style="padding:0"><span class="small muted">Attendance</span><div class="bar"><i class="'+(att<75?'bad':att<80?'warn':'good')+'" style="width:'+att+'%"></i><u style="left:75%"></u></div><span class="mono small" style="text-align:right">'+att+'%</span></div>'+
    '</article>';
  }).join('');
  const ht=histTotals();
  const terms=HIST.map(t=>'<details class="term"><summary><span>'+t.label+'</span><span class="gp">GPA '+termGpa(t).toFixed(2)+'</span></summary><div class="tbl"><table><thead><tr><th>Code</th><th>Course</th><th class="r">Credits</th><th class="r">Mark</th><th>Grade</th></tr></thead><tbody>'+
     t.rows.map(r=>'<tr><td class="mono">'+r[0]+'</td><td>'+esc(r[1])+'</td><td class="r num">'+r[2]+'</td><td class="r num">'+r[3]+'</td><td>'+chip(r[3])+'</td></tr>').join('')+'</tbody></table></div></details>').join('');
  return '<div class="stack">'+
   '<div class="note">Grades combine every assessment marked so far. A mark entered by a lecturer shows here straight away. Try the Lecturer view and change a CSC201 mark.</div>'+
   '<div class="grid2">'+cards+'</div>'+
   '<section class="card"><h2>Transcript</h2><p class="sub">Cumulative GPA '+(ht.pts/ht.cr).toFixed(2)+' over '+ht.cr+' credits.</p>'+terms+
   '<div class="scale" style="margin-top:12px"><span class="lbl">Scale</span>'+SCALE.map((s,i)=>'<span><b>'+s[1]+'</b> '+(i===0?'75+':s[0]===0?'below 50':s[0]+'–'+(SCALE[i-1][0]-1))+' = '+s[2].toFixed(1)+'</span>').join('')+'</div></section></div>';
}

function vRegistration(){
  const p=paid(),cleared=p.pct>=CLEAR;
  const regd=CAT.filter(c=>S.regIds.includes(c.code));
  const cr=regd.reduce((a,c)=>a+c.cr,0);
  const ok=cr>=12&&cr<=20&&cleared;
  const opts=CAT.map(c=>{
    const inReg=S.regIds.includes(c.code),pr=prereqState(c);
    const others=regd.filter(o=>o.code!==c.code),cl=clashes(c,others);
    const left=c.seats-c.taken,full=left<=0,wl=S.waitlist.includes(c.code);
    let btn='',why='';
    if(inReg){btn='<button type="button" class="btn small" data-act="reg-remove" data-code="'+c.code+'"'+(S.submitted?' disabled':'')+'>Remove</button>'}
    else if(S.submitted){btn='<button type="button" class="btn small" disabled>Locked</button>'}
    else if(!cleared){btn='<button type="button" class="btn small" disabled>'+ic('lock')+' Fee hold</button>';why='Registration is on hold until '+CLEAR+'% of fees are cleared.'}
    else if(pr.st==='blocked'){btn='<button type="button" class="btn small" disabled>Not eligible</button>';why='Prerequisite not met.'}
    else if(full){btn='<button type="button" class="btn small" data-act="reg-wait" data-code="'+c.code+'">'+(wl?'Leave waitlist':'Join waitlist')+'</button>'}
    else if(cl.length){btn='<button type="button" class="btn small" disabled>Clash</button>';why='Overlaps '+cl[0].code+' on '+cl[0].txt+'.'}
    else if(cr+c.cr>20){btn='<button type="button" class="btn small" disabled>Over 20 credits</button>'}
    else btn='<button type="button" class="btn small primary" data-act="reg-add" data-code="'+c.code+'">'+ic('plus')+' Add</button>';
    const seatPill=full?'<span class="pill bad">Full</span>':left<=5?'<span class="pill warn">'+left+' seats left</span>':'<span class="pill">'+left+' seats</span>';
    return '<div class="opt'+(inReg?' in':'')+'"><div class="hd"><div class="nm"><span class="mono small muted">'+c.code+'</span> · <span class="small muted">'+c.cr+' credits · '+c.kind+'</span><br><b>'+esc(c.name)+'</b></div><div style="flex:none">'+btn+'</div></div>'+
      '<div class="meta"><span>'+esc(c.lect)+'</span><span>'+c.slots.map(slotTxt).join(' · ')+'</span></div>'+
      '<div class="chips" style="gap:6px">'+seatPill+(pr.notes.length?'<span class="pill '+(pr.st==='blocked'?'bad':pr.st==='prov'?'warn':'good')+'">'+(pr.st==='prov'?'Provisional: ':'')+esc(pr.notes.join(', '))+'</span>':'<span class="pill good">No prerequisites</span>')+(wl?'<span class="pill acc">On waitlist</span>':'')+'</div>'+
      (why?'<div class="small" style="color:var(--bad)">'+esc(why)+'</div>':'')+'</div>';
  }).join('');
  return '<div class="stack"><div class="cols"><section class="card"><h2>Course catalogue</h2><p class="sub">Eight courses open for Semester 2. Clashes, prerequisites and your credit limit are checked as you add.</p>'+opts+'</section>'+
   '<div class="stack sticky">'+
   '<section class="card"><h2>Your registration</h2><p class="sub">12 to 20 credits needed.</p>'+
     '<div style="display:flex;justify-content:space-between;align-items:baseline"><span class="bal" style="font-size:36px">'+cr+'</span><span class="muted small">credits chosen</span></div>'+
     '<div class="meter" aria-hidden="true"><i style="width:'+clamp(cr/24*100,0,100)+'%"></i><u style="left:'+(12/24*100)+'%"><span>12</span></u><u style="left:'+(20/24*100)+'%"><span>20</span></u></div>'+
     (regd.length?'<div class="list">'+regd.map(c=>'<div><div class="grow"><b>'+esc(c.name)+'</b><div class="muted small mono">'+c.code+'</div></div><span class="mono small">'+c.cr+' cr</span></div>').join('')+'</div>':'<div class="empty">Nothing chosen yet.</div>')+
     '<div style="margin-top:14px;display:flex;flex-direction:column;gap:10px">'+
     (cleared?'<div class="note good">Fees cleared to '+Math.round(p.pct)+'%. You can register.</div>':'<div class="note bad">Fees are '+Math.round(p.pct)+'% cleared. Registration needs '+CLEAR+'%. Pay '+money(Math.ceil(TOTAL*CLEAR/100-p.ver))+' more.</div>')+
     (cr<12?'<div class="note warn">Add at least '+(12-cr)+' more credits to submit.</div>':'')+
     (S.submitted?'<div class="note good">Submitted. Reference <b class="mono">'+esc(S.regRef)+'</b>. Awaiting department approval.</div><button type="button" class="btn" data-act="reg-reopen">Reopen to edit</button>':'<button type="button" class="btn primary" data-act="reg-submit"'+(ok?'':' disabled')+'>'+ic('send')+' Submit registration</button>')+
     '</div></section></div></div>'+
   '<section class="card"><h2>Draft timetable</h2><p class="sub">Your Semester 2 week with the courses chosen above.</p>'+(regd.length?renderGrid(blocksOf(regd),false):'<div class="empty">Add a course to see it placed in your week.</div>')+'</section></div>';
}

function rowCells(c,i){
  const k=calc(c,marks[c.code][i]);
  if(k.standing==null)return '<span class="muted">No marks</span>';
  return '<span class="num"><b>'+k.standing.toFixed(1)+'%</b></span> '+chip(k.standing)+'<div class="small muted">of '+k.done+'% assessed</div>';
}
function statsHtml(c){
  const st=ROSTER.map((_,i)=>calc(c,marks[c.code][i]).standing).filter(v=>v!=null);
  if(!st.length)return '<h2>Class summary</h2><div class="empty" style="margin-top:12px">Enter some marks to see statistics.</div>';
  const mean=st.reduce((a,b)=>a+b,0)/st.length,pass=st.filter(v=>v>=50).length,risk=st.filter(v=>v<50).length;
  const buckets=['A','B+','B','C+','C','F'].map(l=>({l,n:st.filter(v=>grade(v)[1]===l).length}));
  const mx=Math.max.apply(null,buckets.map(b=>b.n).concat([1]));
  return '<h2>Class summary</h2><p class="sub">Based on work marked so far.</p>'+
   '<div class="formrow" style="margin-bottom:14px"><div><div class="lbl">Mean</div><div class="bal" style="font-size:30px">'+mean.toFixed(1)+'%</div></div><div><div class="lbl">Pass rate</div><div class="bal" style="font-size:30px">'+Math.round(pass/st.length*100)+'%</div></div></div>'+
   '<div class="dist" role="img" aria-label="Grade distribution">'+buckets.map(b=>'<div><span>'+b.n+'</span><i style="height:'+(b.n/mx*80)+'px;'+(b.l==='F'?'background:var(--bad)':'')+'"></i><span>'+b.l+'</span></div>').join('')+'</div>'+
   (risk?'<div class="note bad" style="margin-top:14px">'+risk+' student'+(risk>1?'s are':' is')+' below 50% and flagged in the table.</div>':'<div class="note good" style="margin-top:14px">Nobody is below 50% right now.</div>');
}
function staffRefresh(){
  const c=CUR.find(x=>x.code===S.staffCourse);if(!c)return;
  ROSTER.forEach((_,i)=>{
    const el=$('#sc-'+i),row=$('#r-'+i);if(!el)return;
    el.innerHTML=rowCells(c,i);
    const k=calc(c,marks[c.code][i]);row.classList.toggle('risk',k.standing!=null&&k.standing<50);
  });
  const s=$('#stats');if(s)s.innerHTML=statsHtml(c);
}
function buildCsv(){
  const c=CUR.find(x=>x.code===S.staffCourse);
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const lines=[['Student ID','Name'].concat(c.as.map(a=>a.n+' (/'+a.max+')'),['Standing %','Grade']).map(q).join(',')];
  ROSTER.forEach((st,i)=>{const k=calc(c,marks[c.code][i]);
    lines.push([st.id,st.name].concat(marks[c.code][i].map(v=>v==null?'':v),[k.standing==null?'':k.standing.toFixed(1),k.standing==null?'':grade(k.standing)[1]]).map(q).join(','));});
  return lines.join('\n');
}

function threadsFor(role){
  if(role==='student'){
    return CUR.map((c,ci)=>({id:'s0|'+c.code,title:c.lect,sub:c.code+' · '+c.name,kind:'Lecturer',ci}))
      .concat([{id:'s0|ADV',title:ADVISOR.name,sub:ADVISOR.title,kind:'Advisor',ci:5}]);
  }
  if(role==='staff')return ROSTER.map((st,i)=>({id:'s'+i+'|CSC201',title:st.name,sub:st.id+' · CSC201',kind:'Student',ci:0}));
  return ROSTER.map((st,i)=>({id:'s'+i+'|ADV',title:st.name,sub:st.id,kind:'Student',ci:5}));
}
const seenKey=(role,id)=>role+':'+id;
function threadUnread(role,id){
  const list=S.chat[id]||[],seen=S.seen[seenKey(role,id)]||0;
  return list.slice(seen).filter(m=>m.w!==role).length;
}
const chatUnread=role=>threadsFor(role).reduce((a,t)=>a+threadUnread(role,t.id),0);
const sameDay=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();
function clock(at){return new Date(at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
function dayLabel(at){
  const now=Date.now();
  if(sameDay(at,now))return 'Today';
  if(sameDay(at,now-864e5))return 'Yesterday';
  return new Date(at).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
}
function shortTime(at){return sameDay(at,Date.now())?clock(at):dayLabel(at)==='Yesterday'?'Yesterday':new Date(at).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
const initials=n=>n.replace(/^(Dr|Mrs|Mr|Ms|Prof)\s+/,'').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const QUICK={
  'student|Lecturer':['Ask about a mark','Request an extension','Ask for office hours'],
  'student|Advisor':['Request a meeting','Ask about electives','Talk about my workload'],
  'staff|Student':['Please see me in office hours','Extension approved','Send me your draft'],

};
function vMessages(){
  const role=S.role,ths=threadsFor(role);
  if(!ths.some(t=>t.id===S.thread)){

    S.thread=(firstUnread||ths[0]).id;
  }
  const t=ths.find(x=>x.id===S.thread);
  const desktop=window.matchMedia&&matchMedia('(min-width: 861px)').matches;
  const showing=desktop||S.chatPane==='thread';
  const list=S.chat[t.id]||[];
  if(showing&&(S.seen[seenKey(role,t.id)]||0)!==list.length){S.seen[seenKey(role,t.id)]=list.length;save()}
  const row=th=>{
    const l=S.chat[th.id]||[],last=l[l.length-1],un=threadUnread(role,th.id);
    return '<button type="button" class="th" style="--cc:var(--c'+(th.ci%5+1)+')" data-act="thread" data-id="'+th.id+'"'+(th.id===t.id?' aria-current="true"':'')+'>'+

      '<span class="mt">'+(last?shortTime(last.at):'')+(un?'<span class="ub" aria-label="'+un+' unread">'+un+'</span>':'')+'</span></button>';
  };
  let groups='';
  if(role==='student'){
    groups='<div class="grp lbl">Your lecturers</div>'+ths.filter(x=>x.kind==='Lecturer').map(row).join('')+'<div class="grp lbl">Your advisor</div>'+ths.filter(x=>x.kind==='Advisor').map(row).join('');
  }else{
    groups='<div class="grp lbl">'+(role==='staff'?'Students in CSC201':'Your advisees')+'</div>'+ths.slice().sort((a,b)=>((S.chat[b.id]||[]).length?(S.chat[b.id].slice(-1)[0].at):0)-((S.chat[a.id]||[]).length?(S.chat[a.id].slice(-1)[0].at):0)).map(row).join('');
  }
  let body='',prev=0;
  list.forEach(m=>{
    if(!prev||!sameDay(prev,m.at))body+='<div class="day">'+dayLabel(m.at)+'</div>';
    prev=m.at;
    body+='<div class="bub'+(m.w===role?' me':'')+'">'+esc(m.text)+'<time datetime="'+new Date(m.at).toISOString()+'">'+(m.w===role?'You':esc(t.title))+' · '+clock(m.at)+'</time></div>';
  });
  if(!list.length)body='<div class="nomsg"><b>No messages yet.</b><br>Start the conversation with '+esc(t.title)+' below.</div>';
  const qs=QUICK[role+'|'+t.kind]||[];
  return '<div class="stack"><div class="note">Demo: nobody replies automatically. Switch between Student, Lecturer and Advisor in the side menu to answer from the other side. The lecturer inbox covers CSC201 and the advisor inbox covers all advisees.</div>'+

    '<div class="tlist" aria-label="Conversations">'+groups+'</div>'+
    '<section class="conv" aria-label="Conversation with '+esc(t.title)+'">'+
     '<div class="ch"><button type="button" class="btn small only-m" data-act="chatback" aria-label="Back to conversations">'+ic('back')+'</button><div style="min-width:0"><h2>'+esc(t.title)+'</h2><div class="small muted">'+esc(t.sub)+'</div></div><span class="pill acc" style="margin-left:auto">'+t.kind+'</span></div>'+
     '<div class="msgs" id="msgs" role="log" aria-live="polite">'+body+'</div>'+
     '<form class="composer" data-form="chat">'+
      (qs.length?'<div class="chips" role="group" aria-label="Quick messages">'+qs.map(q=>'<button type="button" data-act="chip" data-q="'+esc(q)+'">'+esc(q)+'</button>').join('')+'</div>':'')+
      '<div class="row"><textarea id="msg" name="text" rows="2" maxlength="1000" placeholder="Write a message. Enter sends, Shift+Enter adds a line." aria-label="Message to '+esc(t.title)+'"></textarea><button type="submit" class="btn primary">'+ic('send')+' Send</button></div>'+
     '</form></section></div></div>';
}

/* ---------- shell ---------- */
const VIEWS={messages:vMessages,dashboard:vDashboard,courses:vCourses,timetable:vTimetable,registration:vRegistration,fees:vFees,announcements:vAnnouncements,gradebook:vGradebook,announce:vAnnounce};
function isDark(){return S.theme==='dark'||(S.theme!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
function applyTheme(){
  const r=document.documentElement;
  if(S.theme==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);
  $('#themeBtn').innerHTML=isDark()?ic('sun')+' Light':ic('moon')+' Dark';
}
function render(keepScroll){
  const staff=S.role==='staff',advisor=S.role==='advisor';
  const nav=staff?NAV_T:advisor?NAV_A:NAV_S;
  if(!nav.some(n=>n[0]===S.view))S.view=nav[0][0];
  const badge=id=>id==='announcements'?(S.role==='student'?unreadCount():0):id==='messages'?chatUnread(S.role):0;
  $('#nav').innerHTML=nav.map(n=>{const b=badge(n[0]);return '<button type="button" data-act="nav" data-v="'+n[0]+'"'+(S.view===n[0]?' aria-current="page"':'')+'>'+ic(n[2])+'<span>'+n[1]+'</span>'+(b?'<span class="badge" aria-label="'+b+' unread">'+b+'</span>':'')+'</button>'}).join('');
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.role===S.role)));
  $('#title').textContent=TITLES[S.view];
  $('#term').textContent=TERM+' · Week '+WEEK+' of 15';
  $('#user').innerHTML=staff?'<span class="avatar">RN</span><div><b>'+STAFF.name+'</b><span class="muted">Lecturer, '+STAFF.dept+'</span></div>':advisor?'<span class="avatar">GC</span><div><b>'+ADVISOR.name+'</b><span class="muted">'+ADVISOR.title+', '+ADVISOR.dept+'</span></div>':'<span class="avatar">TM</span><div><b>'+STUDENT.name+'</b><span class="muted">'+STUDENT.id+' · '+STUDENT.programme+', Year '+STUDENT.year+'</span></div>';
  $('#view').innerHTML=VIEWS[S.view]();
  if(S.view==='gradebook')staffRefresh();
  if(S.view==='messages'){const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight}
  applyTheme();
  try{if(history.replaceState)history.replaceState(null,'','#'+S.view)}catch(e){}
  if(!keepScroll)window.scrollTo(0,0);
}
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}
const go=(v,keep)=>{S.view=v;render(keep)};

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='nav')go(el.dataset.v);
  else if(a==='role'){const prev=S.role;S.role=el.dataset.role;S.thread=null;S.chatPane='list';
    S.view=S.role==='staff'?(prev!=='staff'&&S.view==='messages'?'messages':'gradebook'):S.role==='advisor'?'messages':(S.view==='messages'&&prev!=='student'?'messages':'dashboard');render()}
  else if(a==='thread'){S.thread=el.dataset.id;S.chatPane='thread';render(true);const t=$('#msg');if(t&&window.matchMedia&&matchMedia('(min-width: 861px)').matches)t.focus()}
  else if(a==='chatback'){S.chatPane='list';render(true)}
  else if(a==='chip'){const t=$('#msg');if(t){t.value=QTEXT[el.dataset.q]||el.dataset.q;t.focus();t.setSelectionRange(t.value.length,t.value.length)}}
  else if(a==='theme'){S.theme=isDark()?'light':'dark';save();applyTheme()}
  else if(a==='reset'){S=freshState();marks=freshMarks();try{localStorage.removeItem(KEY)}catch(x){}render();toast('Sample data restored')}
  else if(a==='ttmode'){S.ttMode=el.dataset.m;render(true)}
  else if(a==='annf'){S.annFilter=el.dataset.f;render(true)}
  else if(a==='annopen'){const id=el.dataset.id;S.openAnn=S.openAnn===id?null:id;S.read[id]=true;save();render(true)}
  else if(a==='readall'){allAnn().forEach(x=>S.read[x.id]=true);save();render(true)}
  else if(a==='reg-add'){const c=CAT.find(x=>x.code===el.dataset.code);
    const cl=clashes(c,CAT.filter(o=>S.regIds.includes(o.code)));
    if(cl.length){toast('That clashes with '+cl[0].code);return}
    S.regIds.push(c.code);S.waitlist=S.waitlist.filter(x=>x!==c.code);save();render(true);toast(c.code+' added')}
  else if(a==='reg-remove'){S.regIds=S.regIds.filter(x=>x!==el.dataset.code);save();render(true)}
  else if(a==='reg-wait'){const c=el.dataset.code;S.waitlist=S.waitlist.includes(c)?S.waitlist.filter(x=>x!==c):S.waitlist.concat(c);save();render(true);toast(S.waitlist.includes(c)?'On the waitlist for '+c:'Left the waitlist')}
  else if(a==='reg-submit'){S.submitted=true;S.regRef='REG-'+String(base.getFullYear()).slice(2)+'-'+String(Math.abs(S.regIds.join('').split('').reduce((h,ch)=>(h*31+ch.charCodeAt(0))|0,7))%10000).padStart(4,'0');save();render(true);toast('Registration submitted')}
  else if(a==='reg-reopen'){S.submitted=false;save();render(true)}
  else if(a==='csv'){
    const text=buildCsv();
    const fail=()=>{S.csv=text;$('#csvarea').innerHTML=csvBox();const ta=$('#csvta');if(ta){ta.focus();ta.select()}};
    try{navigator.clipboard.writeText(text).then(()=>{S.csv='';$('#csvarea').innerHTML='';toast('CSV copied')},fail)}catch(x){fail()}
  }
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='done'){S.done[el.dataset.key]=el.checked;save();render(true)}
  else if(a==='target'){S.target[el.dataset.code]=el.value;save();render(true)}
  else if(a==='staffcourse'){S.staffCourse=el.value;S.csv='';render(true)}
});
document.addEventListener('input',e=>{
  const el=e.target;if(!el.hasAttribute||!el.hasAttribute('data-mark'))return;
  const c=CUR.find(x=>x.code===S.staffCourse),i=+el.dataset.s,j=+el.dataset.j,max=c.as[j].max;
  if(el.value===''){marks[c.code][i][j]=null;el.setAttribute('aria-invalid','false')}
  else{
    const v=parseFloat(el.value);
    if(isNaN(v)||v<0||v>max){el.setAttribute('aria-invalid','true');toast('Marks for '+c.as[j].n+' must be between 0 and '+max);return}
    el.setAttribute('aria-invalid','false');marks[c.code][i][j]=v;
  }
  save();staffRefresh();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.target&&e.target.id==='msg'){
    e.preventDefault();
    const f=e.target.form;if(f)f.requestSubmit?f.requestSubmit():f.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
  }
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  const d=new FormData(f);
  if(f.dataset.form==='chat'){
    const text=String(d.get('text')||'').trim();
    if(!text){toast('Write a message first');return}
    const id=S.thread;if(!id)return;
    (S.chat[id]=S.chat[id]||[]).push({w:S.role,at:Date.now(),text:text.slice(0,1000)});
    S.seen[seenKey(S.role,id)]=S.chat[id].length;
    save();render(true);
    const t=$('#msg');if(t&&window.matchMedia&&matchMedia('(min-width: 861px)').matches)t.focus();
    return;
  }
  if(f.dataset.form==='pay'){
    const amt=parseFloat(d.get('amount')),p=paid(),room=TOTAL-p.ver-p.pend;
    if(!(amt>0)){toast('Enter an amount above zero');return}
    if(amt>room+0.001){toast('That is more than the '+money(room)+' still unpaid');return}
    S.payments.push({id:Date.now(),date:0,amount:Math.round(amt*100)/100,method:String(d.get('method')),ref:String(d.get('ref')||'').trim(),status:'Pending'});
    save();render(true);toast('Added as pending');
  }else if(f.dataset.form==='post'){
    const t=String(d.get('title')).trim(),b=String(d.get('body')).trim();
    if(!t||!b){toast('Add a title and a message');return}
    const aud=String(d.get('aud'));
    S.posted.unshift({id:'p'+Date.now(),cat:String(d.get('cat')),pin:false,from:STAFF.name,day:0,unread:true,t:t,b:b,aud:aud?aud+' class':''});
    save();render(true);toast('Posted. Students can see it now');
  }
});
if(window.matchMedia){try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}}

render(true);
})();
</script>

</body></html>
